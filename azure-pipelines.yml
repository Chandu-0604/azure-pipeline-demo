
trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- script: |
    echo "Starting HTML project build..."
    ls -la
    test -f index.html
    echo "index.html found successfully!"
  displayName: 'Check HTML file'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)'
    ArtifactName: 'HTML-Website'
    publishLocation: 'Container'
  displayName: 'Publish HTML artifact'
